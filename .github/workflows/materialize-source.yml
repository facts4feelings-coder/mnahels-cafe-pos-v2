name: Materialize tested source once
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'refactor/performance-v0.15.61' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Materialize and verify both projects
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & dotnet build src/MnahelsCafe.Pos/MnahelsCafe.Pos.csproj -c Release --nologo *> materialize.log
          if($LASTEXITCODE -ne 0){Get-Content materialize.log;exit $LASTEXITCODE}
          & dotnet build src/MnahelsCafe.Desktop/MnahelsCafe.Desktop.csproj -c Release --nologo >> materialize.log 2>&1
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & node scripts/materialize-source.cjs >> materialize.log 2>&1
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & dotnet build src/MnahelsCafe.Pos/MnahelsCafe.Pos.csproj -c Release --nologo >> materialize.log 2>&1
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & dotnet build src/MnahelsCafe.Desktop/MnahelsCafe.Desktop.csproj -c Release --nologo >> materialize.log 2>&1
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & node scripts/test-v57-receipts.cjs >> materialize.log 2>&1
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- src scripts .github reports
          git commit -m 'Materialize verified source; remove 16 historical patch scripts'
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          git push origin HEAD:refactor/performance-v0.15.61
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Report diagnostics
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');let body='Source materialization: '+context.runId+'\n';
            if(fs.existsSync('materialize.log')) body+='```text\n'+fs.readFileSync('materialize.log','utf8').slice(-10000)+'\n```';
            await github.rest.issues.createComment({...context.repo,issue_number:context.issue.number,body});
