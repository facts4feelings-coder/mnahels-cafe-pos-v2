name: Apply v0.15.27 UI release

on:
  workflow_dispatch:
  push:
    branches: [ui/v0.15.27-readability]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply release metadata and asset loading
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f'{old!r} not found in {path}')
              if count is not None and found != count:
                  raise SystemExit(f'expected {count} copies of {old!r} in {path}, found {found}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace('RUN-APP.ps1', '$buildVersion = "0.15.26"', '$buildVersion = "0.15.27"', 1)
          replace('RUN-APP.ps1', '$uiRevision = "20260830-receipt-readability-24"', '$uiRevision = "20260901-ui-readability-27"', 1)
          replace('RUN-APP.ps1', 'wwwroot\\v44.css', 'wwwroot\\v49.css', 1)
          replace('RUN-APP.ps1', '/v44.js?v=$uiRevision', '/v49.js?v=$uiRevision', 1)
          replace('installer/MnahelsCafePOS.iss', '0.15.26.0', '0.15.27.0', 1)
          replace('installer/MnahelsCafePOS.iss', '#define MyAppVersion "0.15.26"', '#define MyAppVersion "0.15.27"', 1)
          replace('src/MnahelsCafe.Pos/MnahelsCafe.Pos.csproj', '<Version>0.15.26</Version>', '<Version>0.15.27</Version>', 1)
          replace('src/MnahelsCafe.Desktop/MnahelsCafe.Desktop.csproj', '<Version>0.15.26</Version>', '<Version>0.15.27</Version>', 1)
          replace('src/MnahelsCafe.Desktop/Program.cs', 'BuildTag = "0.15.26"', 'BuildTag = "0.15.27"', 1)

          index = Path('src/MnahelsCafe.Pos/wwwroot/index.html')
          html = index.read_text(encoding='utf-8')
          if 'content="0.15.27"' not in html:
              if html.count('content="0.15.26"') != 1:
                  raise SystemExit('application version marker was not unique')
              html = html.replace('content="0.15.26"', 'content="0.15.27"')
          if '/v49.css' not in html:
              html = html.replace('</head>', '<link rel="stylesheet" href="/v49.css?v=20260901-ui-readability-27"></head>')
          if '/v49.js' not in html:
              html = html.replace('</body>', '<script src="/v49.js?v=20260901-ui-readability-27"></script></body>')
          index.write_text(html, encoding='utf-8')
          PY

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          node --check src/MnahelsCafe.Pos/wwwroot/v49.js
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import re
          for path in Path('src').rglob('*.csproj'):
              ET.parse(path)
          html = Path('src/MnahelsCafe.Pos/wwwroot/index.html').read_text(encoding='utf-8')
          root = Path('src/MnahelsCafe.Pos/wwwroot')
          refs = re.findall(r'(?:src|href)="/([^"?#]+)', html)
          missing = [x for x in refs if not (root / x).is_file()]
          assert not missing, missing
          assert html.count('/v49.css') == 1
          assert html.count('/v49.js') == 1
          assert "const BUILD='0.15.27',UI_REVISION='20260901-ui-readability-27'" in Path('src/MnahelsCafe.Pos/wwwroot/v49.js').read_text(encoding='utf-8')
          assert '#define MyAppVersion "0.15.27"' in Path('installer/MnahelsCafePOS.iss').read_text(encoding='utf-8')
          print(f'validated {len(refs)} local UI references')
          PY

      - name: Commit verified release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add RUN-APP.ps1 installer/MnahelsCafePOS.iss \
            src/MnahelsCafe.Pos/MnahelsCafe.Pos.csproj \
            src/MnahelsCafe.Desktop/MnahelsCafe.Desktop.csproj \
            src/MnahelsCafe.Desktop/Program.cs \
            src/MnahelsCafe.Pos/wwwroot/index.html
          git commit -m 'release: prepare Mnahel POS v0.15.27'
          git push origin HEAD:ui/v0.15.27-readability
