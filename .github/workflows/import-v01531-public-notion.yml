name: Import v0.15.31 complete source

on:
  push:
    branches:
      - release/v0.15.31-final

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified source package
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python3 - <<'PY' 2>&1 | tee /tmp/import-v01531.log
          import http.cookiejar, json, re, sys, urllib.parse, urllib.request
          from pathlib import Path

          expected='b9a9b030aeb9f749b58e7226a3ecba46aa8234cffbc7a8d13f52d825d9505816'
          target='mnahels-cafe-pos-v0.15.31-COMPLETE.zip'
          page_url=Path('.transfer/public-page-url.txt').read_text().strip()
          page_id='8d16e265-09df-4ea7-899d-6172f8e8b206'
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          headers={'User-Agent':'Mozilla/5.0','Content-Type':'application/json'}

          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with opener.open(req,timeout=45) as response:
                  return response.read(),response.geturl()

          def post(endpoint,payload):
              req=urllib.request.Request('https://www.notion.so/api/v3/'+endpoint,data=json.dumps(payload).encode(),headers=headers,method='POST')
              with opener.open(req,timeout=45) as response:
                  return json.loads(response.read())

          def strings(value):
              if isinstance(value,str):
                  yield value
              elif isinstance(value,dict):
                  for child in value.values(): yield from strings(child)
              elif isinstance(value,list):
                  for child in value: yield from strings(child)

          candidates=[]
          html,final_page=get(page_url)
          decoded=urllib.parse.unquote(html.decode('utf-8','ignore').replace('\\u0026','&').replace('\\/','/'))
          for match in re.findall(r'https?[^"<>\\ ]+',decoded):
              if target in match: candidates.append(match)

          data=None
          last_error=None
          payloads=[
              ('loadPageChunk',{'pageId':page_id,'limit':100,'cursor':{'stack':[]},'chunkNumber':0,'verticalColumns':False}),
              ('loadCachedPageChunk',{'pageId':page_id,'limit':100,'cursor':{'stack':[]}})
          ]
          for endpoint,payload in payloads:
              try:
                  data=post(endpoint,payload)
                  if data: break
              except Exception as exc:
                  last_error=f'{endpoint}: {exc}'
          if data is None:
              raise RuntimeError('Could not load public Notion page: '+str(last_error))

          blocks=((data.get('recordMap') or {}).get('block') or {})
          source=None; block_id=None; space_id=None
          for bid,wrapper in blocks.items():
              if target not in json.dumps(wrapper): continue
              block_id=bid
              value=wrapper.get('value') if isinstance(wrapper,dict) else None
              if isinstance(value,dict): space_id=value.get('space_id') or value.get('spaceId')
              for text in strings(wrapper):
                  if target in text and (text.startswith('attachment:') or text.startswith('https://')):
                      source=text; break
              if source: break
          for text in strings(data):
              if target in text and text.startswith('https://'): candidates.append(text)

          if source and source.startswith('attachment:'):
              permission={'table':'block','id':block_id}
              if space_id: permission['spaceId']=space_id
              signed=post('getSignedFileUrls',{'urls':[{'permissionRecord':permission,'url':source}]})
              candidates.extend(signed.get('signedUrls') or [])
          elif source:
              candidates.append(source)

          candidates=[urllib.parse.unquote(x).replace('\\u0026','&') for x in candidates if isinstance(x,str)]
          if not candidates:
              raise RuntimeError('Source attachment was not found on public transfer page.')
          errors=[]
          for url in candidates:
              try:
                  blob,final_url=get(url)
                  import hashlib
                  digest=hashlib.sha256(blob).hexdigest()
                  print('candidate',final_url,'bytes',len(blob),'sha256',digest)
                  if digest==expected:
                      Path('/tmp/mnahels-v0.15.31.zip').write_bytes(blob)
                      print('SOURCE_DOWNLOAD_OK',len(blob),digest)
                      sys.exit(0)
              except Exception as exc:
                  errors.append(str(exc))
          raise RuntimeError('No candidate matched the verified package: '+' | '.join(errors[-3:]))
          PY
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            cp /tmp/import-v01531.log .transfer/import-diagnostic.txt
            git add .transfer/import-diagnostic.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Record v0.15.31 import diagnostic' || true
            git push origin HEAD || true
            exit "$code"
          fi
          echo 'b9a9b030aeb9f749b58e7226a3ecba46aa8234cffbc7a8d13f52d825d9505816  /tmp/mnahels-v0.15.31.zip' | sha256sum --check --strict
      - name: Replace branch and validate release source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mnahels-source
          unzip -q /tmp/mnahels-v0.15.31.zip -d /tmp/mnahels-source
          test -f /tmp/mnahels-source/src/MnahelsCafe.Pos/wwwroot/v53.js
          test -f /tmp/mnahels-source/src/MnahelsCafe.Pos/wwwroot/assets/menu-images-manifest.json
          git ls-files -z | xargs -0 rm -f
          cp -a /tmp/mnahels-source/. .
          rm -rf .transfer .github/workflows/import-v01531-public-notion.yml
          node --check src/MnahelsCafe.Pos/wwwroot/v53.js
          grep -q '0.15.31' src/MnahelsCafe.Pos/MnahelsCafe.Pos.csproj
          grep -q 'build-server:' .github/workflows/windows-installer.yml
          grep -q 'build-desktop:' .github/workflows/windows-installer.yml
          grep -q 'compile-installer:' .github/workflows/windows-installer.yml
          test "$(find src/MnahelsCafe.Pos/wwwroot/assets/menu -name '*.webp' | wc -l)" -eq 91
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import complete v0.15.31 source and menu assets'
          git push origin HEAD
