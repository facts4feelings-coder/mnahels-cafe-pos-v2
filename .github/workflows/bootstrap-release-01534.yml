name: Bootstrap v0.15.34 release

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: bootstrap-v01534-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare-and-build:
    if: github.head_ref == 'release/v0.15.34-delivery-receipts'
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      BRANCH: release/v0.15.34-delivery-receipts
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply validated v0.15.34 source update
        shell: pwsh
        run: python tools/apply_release_01534_remote.py
      - name: Validate browser scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem 'src\MnahelsCafe.Pos\wwwroot\*.js' | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript check failed: $($_.Name)" }
          }
      - name: Restore and build server
        run: |
          dotnet restore src/MnahelsCafe.Pos/MnahelsCafe.Pos.csproj --runtime win-x64 --nologo
          dotnet build src/MnahelsCafe.Pos/MnahelsCafe.Pos.csproj -c Release -r win-x64 --self-contained true --no-restore --nologo
      - name: Restore and build desktop
        run: |
          dotnet restore src/MnahelsCafe.Desktop/MnahelsCafe.Desktop.csproj --runtime win-x64 --nologo
          dotnet build src/MnahelsCafe.Desktop/MnahelsCafe.Desktop.csproj -c Release -r win-x64 --self-contained true --no-restore --nologo
      - name: Commit verified release source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item 'tools\apply_release_01534_remote.py' -Force
          Remove-Item '.github\workflows\bootstrap-release-01534.yml' -Force
          git config user.name 'facts4feelings-coder'
          git config user.email 'facts4feelings@gmail.com'
          git add -A
          git commit -m "Release Mnahel's Cafe POS v0.15.34"
          git push origin "HEAD:$env:BRANCH"
      - name: Build official Windows installer
        id: installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh workflow run windows-installer.yml --ref $env:BRANCH
          $run = $null
          for ($i = 0; $i -lt 30 -and -not $run; $i++) {
            Start-Sleep -Seconds 4
            $items = gh run list --workflow windows-installer.yml --branch $env:BRANCH --event workflow_dispatch --limit 1 --json databaseId,url,status,conclusion | ConvertFrom-Json
            if ($items.Count -gt 0) { $run = $items[0] }
          }
          if (-not $run) { throw 'Official installer workflow run was not found.' }
          "run_id=$($run.databaseId)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "run_url=$($run.url)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          gh run watch $run.databaseId --exit-status
      - name: Post installer link on pull request
        if: success()
        shell: pwsh
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "v0.15.34 Windows installer ready: ${{ steps.installer.outputs.run_url }}"
