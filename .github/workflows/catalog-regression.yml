name: Catalog regression tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: catalog-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  catalog-regression:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test current catalog source
        shell: pwsh
        run: |
          dotnet build src/MnahelsCafe.Pos/MnahelsCafe.Pos.csproj -c Release --nologo *> catalog-tests.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node scripts/test-catalog-sync.cjs >> catalog-tests.log 2>&1
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node scripts/test-v61-catalog.cjs >> catalog-tests.log 2>&1
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v61-catalog-test-results
          path: |
            catalog-tests.log
            reports/v61-catalog-tests.json
          if-no-files-found: error
      - if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');const log=fs.existsSync('catalog-tests.log')?fs.readFileSync('catalog-tests.log','utf8').slice(-7000):'No test log';await github.rest.issues.createComment({...context.repo,issue_number:context.issue.number,body:'Catalog regression for '+context.payload.pull_request.head.sha+'\n```text\n'+log+'\n```'});
