name: Receipt verification diagnostics
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  read-failed-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const r = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', {
              ...context.repo, job_id: 101285425540
            });
            const text = typeof r.data === 'string' ? r.data : JSON.stringify(r.data);
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: 'Receipt verification failure (temporary diagnostics):\n```text\n' + text.slice(-22000) + '\n```'
            });
