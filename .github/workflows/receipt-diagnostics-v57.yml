name: Receipt verification diagnostics
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: write
concurrency:
  group: receipt-diagnostics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  read-failed-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const ref=context.payload.pull_request.head.sha;
            let check;
            for(let i=0;i<100;i++){
              const r=await github.rest.checks.listForRef({...context.repo,ref,per_page:100});
              check=r.data.check_runs.find(c=>c.name==='build-server');
              if(check?.status==='completed')break;
              await new Promise(r=>setTimeout(r,10000));
            }
            if(!check||check.status!=='completed')return;
            const job=Number(check.details_url.split('/').pop());
            const r=await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs',{...context.repo,job_id:job});
            const text=typeof r.data==='string'?r.data:JSON.stringify(r.data);
            const lines=text.split('\n').filter(l=>/PASS|FAIL|Error:|EXEC :|Overflow|Grey text|JPG|No browser|PENDING|v0.15.57/.test(l));
            await github.rest.issues.createComment({...context.repo,issue_number:context.issue.number,body:'Receipt verification '+ref.slice(0,7)+' — '+check.conclusion+'\n```text\n'+(lines.join('\n')+'\n'+(check.conclusion==='success'?'':text.slice(-5000))).slice(-14000)+'\n```'});
