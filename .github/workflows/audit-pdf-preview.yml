name: Audit PDF visual QA
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: audit-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit-preview:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test PDF, closed shift and menu migration
        run: dotnet run --project src/MnahelsCafe.Audit.Tests/MnahelsCafe.Audit.Tests.csproj -c Release --nologo
      - name: Attach synthetic PDF proof to review
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const zlib = require('zlib');
            const pdf = fs.readFileSync('audit-test-output/shift-audit-visual.pdf');
            const proof = zlib.gzipSync(pdf).toString('base64');
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'Synthetic PDF QA proof for ' + context.payload.pull_request.head.sha + '\n\nNo customer data. Gzip/base64 generated by the actual PDF writer.\n\n```text\n' + proof + '\n```'});
