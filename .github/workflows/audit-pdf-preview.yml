name: Audit PDF visual QA
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: audit-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit-preview:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test PDF, closed shift and menu migration
        run: dotnet run --project src/MnahelsCafe.Audit.Tests/MnahelsCafe.Audit.Tests.csproj -c Release --nologo
      - name: Verify build integration
        id: integration
        continue-on-error: true
        shell: pwsh
        run: |
          & dotnet build src/MnahelsCafe.Pos/MnahelsCafe.Pos.csproj -c Release --nologo 2>&1 | Tee-Object -FilePath qa-build.log
          exit $LASTEXITCODE
      - name: Attach synthetic proof and diagnostics to review
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), zlib = require('zlib');
            let body = 'Synthetic QA proof for ' + context.payload.pull_request.head.sha + '\n\n';
            if (fs.existsSync('audit-test-output/shift-audit-visual.pdf')) {
              const pdf = fs.readFileSync('audit-test-output/shift-audit-visual.pdf');
              body += 'No customer data. Actual PDF writer, gzip/base64.\n```text\n' + zlib.gzipSync(pdf).toString('base64') + '\n```\n';
            }
            if (fs.existsSync('qa-build.log')) body += '\nBuild diagnostics:\n```text\n' + fs.readFileSync('qa-build.log','utf8').slice(-9000) + '\n```';
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
      - name: Require successful integration
        if: steps.integration.outcome == 'failure'
        run: throw 'Build integration failed; see diagnostic comment.'
