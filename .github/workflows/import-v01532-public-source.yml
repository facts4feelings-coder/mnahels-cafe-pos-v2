name: Import verified v0.15.32 source

on:
  push:
    branches:
      - release/v0.15.32-final

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve and download verified source
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python3 - <<'PY' 2>&1 | tee /tmp/import-v01532.log
          import hashlib,http.cookiejar,json,re,sys,urllib.parse,urllib.request,uuid
          from pathlib import Path
          expected='e9bbc3ca9aa019c711a0965b8b4db26e9b99d6c5b8d117dcdefbf96226122dc8'
          target='mnahels-cafe-pos-v0.15.32-COMPLETE.zip'
          page_url=Path('.transfer/public-page-url.txt').read_text().strip()
          tail=urllib.parse.urlsplit(page_url).path.rstrip('/').rsplit('/',1)[-1]
          compact=re.sub(r'[^0-9a-f]','',tail.lower())[-32:]
          page_id=str(uuid.UUID(compact))
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          root='https://www.notion.so/api/v3/'
          def request(url,data=None):
              headers={'User-Agent':'Mozilla/5.0'}
              if data is not None: headers['Content-Type']='application/json'
              req=urllib.request.Request(url,data=None if data is None else json.dumps(data).encode(),headers=headers,method='GET' if data is None else 'POST')
              with opener.open(req,timeout=60) as response: return response.read(),response.geturl()
          def post(name,data): return json.loads(request(root+name,data)[0])
          def strings(value):
              if isinstance(value,str): yield value
              elif isinstance(value,dict):
                  for child in value.values(): yield from strings(child)
              elif isinstance(value,list):
                  for child in value: yield from strings(child)
          data=post('loadPageChunk',{'pageId':page_id,'limit':100,'cursor':{'stack':[]},'chunkNumber':0,'verticalColumns':False})
          blocks=((data.get('recordMap') or {}).get('block') or {})
          source=None; block_id=None; space_id=None
          for bid,wrapper in blocks.items():
              if target not in json.dumps(wrapper): continue
              block_id=bid
              value=wrapper.get('value') if isinstance(wrapper,dict) else None
              if isinstance(value,dict): space_id=value.get('space_id') or value.get('spaceId')
              for text in strings(wrapper):
                  if target in text and (text.startswith('attachment:') or text.startswith('https://')):
                      source=text; break
              if source: break
          print('PUBLIC_PAGE_OK',page_id,'blocks',len(blocks),'file_block',block_id,'source_kind','attachment' if source and source.startswith('attachment:') else 'url' if source else 'missing')
          if not source: raise RuntimeError('The v0.15.32 ZIP attachment was not returned by the public page API.')
          candidates=[]
          if source.startswith('attachment:'):
              permission={'table':'block','id':block_id}
              if space_id: permission['spaceId']=space_id
              signed=post('getSignedFileUrls',{'urls':[{'permissionRecord':permission,'url':source}]})
              candidates.extend(signed.get('signedUrls') or [])
          else: candidates.append(source)
          if not candidates: raise RuntimeError('Notion did not return a signed download URL.')
          for candidate in candidates:
              blob,final_url=request(candidate)
              digest=hashlib.sha256(blob).hexdigest()
              print('DOWNLOAD_CANDIDATE',urllib.parse.urlsplit(final_url).netloc,'bytes',len(blob),'sha256',digest)
              if digest==expected:
                  Path('/tmp/mnahels-v0.15.32.zip').write_bytes(blob)
                  print('SOURCE_DOWNLOAD_OK',len(blob),digest)
                  sys.exit(0)
          raise RuntimeError('Downloaded attachment did not match the verified source checksum.')
          PY
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            cp /tmp/import-v01532.log .transfer/import-diagnostic.txt
            git add .transfer/import-diagnostic.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Record v0.15.32 source import diagnostic' || true
            git push origin HEAD || true
            exit "$code"
          fi
          echo 'e9bbc3ca9aa019c711a0965b8b4db26e9b99d6c5b8d117dcdefbf96226122dc8  /tmp/mnahels-v0.15.32.zip' | sha256sum --check --strict
      - name: Replace branch with complete source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mnahels-source
          unzip -q /tmp/mnahels-v0.15.32.zip -d /tmp/mnahels-source
          git ls-files -z | xargs -0 rm -f
          cp -a /tmp/mnahels-source/. .
          rm -rf .transfer .github/workflows/import-v01532-public-source.yml
          find src/MnahelsCafe.Pos/wwwroot -name '*.js' -print0 | xargs -0 -n1 node --check
          test -f src/MnahelsCafe.Pos/wwwroot/v54.js
          test -f src/MnahelsCafe.Pos/wwwroot/v54.css
          grep -q '0.15.32' src/MnahelsCafe.Pos/MnahelsCafe.Pos.csproj
          grep -q 'Eastern Cross Technology' installer/MnahelsCafePOS.iss
          ! grep -R -q 'TechMint Software Solutions' src installer
          test "$(find src/MnahelsCafe.Pos/wwwroot/assets/menu -name '*.webp' | wc -l)" -eq 91
          test "$(grep -c 'actions/upload-artifact@v4' .github/workflows/windows-installer.yml)" -eq 1
          ! grep -q 'published-win-x64' .github/workflows/windows-installer.yml
          grep -q 'tableCount = orders.Count' src/MnahelsCafe.Pos/ServiceFeatures.cs
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Release complete Mnahel POS v0.15.32 source'
          git push origin HEAD
