name: Import verified v0.15.26 source

on:
  workflow_dispatch:
  push:
    branches: [sync/v0.15.26-safe]

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out safe branch
        uses: actions/checkout@v4
        with:
          ref: sync/v0.15.26-safe
          fetch-depth: 0

      - name: Download and verify source bundle
        env:
          SOURCE_URL: "https://prod-files-secure.s3.us-west-2.amazonaws.com/d92a7155-2cc2-8124-b942-0003fcc481eb/880d7cd3-9d6b-4f49-9729-870f5a756ddd/mnahels-source-transfer.png?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=ASIAZI2LB4667SICNHQ2%2F20260901%2Fus-west-2%2Fs3%2Faws4_request&X-Amz-Date=20260901T061227Z&X-Amz-Expires=3600&X-Amz-Security-Token=IQoJb3JpZ2luX2VjEN3%2F%2F%2F%2F%2F%2F%2F%2F%2F%2FwEaCXVzLXdlc3QtMiJHMEUCIQChMINkoKaIIqkW2ws%2B9vjYw5acyVUgTU04f%2FUJ9KqRUgIgCTr16eWxgNXn2UAyzQA0YSEEqchnMEELGM3SkO8P%2FxgqiAQIpv%2F%2F%2F%2F%2F%2F%2F%2F%2F%2FARAAGgw2Mzc0MjMxODM4MDUiDAcXqLXOO4t%2F1hmT3ircA%2FkuqWk%2BY4xJosE65d5iOWuI75mWcOscByDD%2BccVKtAYgyg40q%2FeVsQVquCuewQefOGWWcdjIq2VEoqal0l%2By1qO3AXud%2FQiHl5KaHylVrzRkz02NXGlAVUfD2D%2FxHo9XtNe08i8dOwLcxSJiD0Ro4qYjUfUcws4OhxMtGyKLGBKnmaz4n5EVz4nGgR7I7BcrK54k3HXuz1WVghtnP%2B4BoiWhHOO3oNaxF2JUzx4NIN%2FqnlPOh5iwhSDsHtNpfM2O6sOkkB02ppNImR7AYmDGZ0%2FV5%2FNaYEsWo%2Bb44nds1RXcMLz6mVjdcZteeKTihhFIoR5R%2BVp8PUIsWvpJEx0U5FK2IpnGaT7kkpSXoZBpnIcZaai7yvgANbelh5u47LC19v%2Fhcp7FZtcdp3YD231HR8YDmdX39klkzEZuB9QJ%2Bd%2FX8oS6%2Fax4AEaaZDP4PXC0%2BfzS7PjNAJ%2BmNJPoFcRv1I4NYB5s2EKjC8MVzbaI1yZHett%2FQe6YKR5SPDJ6%2FWHbOArIMZtRcL9Wno9CnDNqUNP4%2FM0zHE4zc%2B5BwDdTXRP6x6k4IFUefeZp64%2F6EkbH04AKGS4YXFtrCklOn8tIWWotnr7q9sVoLu1i1210IevTgacKzhprx8nYCO9MLeq2dQGOqUBFKacrx1TiD9l7F7zmnANn%2BFVG2V1xRMFoLVIq5nnBQpZi8FvJPeOxULCxEJNxbuWAAJCtyxf%2F0zixaNJXnjVDT3y3Hfg50Qqa6WvML%2FEBSM5qSAztMvatT%2FghdYVfkeREmmktPXfisV%2BQYlE8I6VY6ZV5ocV%2BOoUQpAGyQnH4FsVDFq%2Byb1goJ8opW82Ul%2BAjxnrBqrdhGi8InjrsvXKkygJiFtq&X-Amz-Signature=ab8746f8b7945c0ccdf5249d410c07bdedf13038ecdaa3252d25aed9df06f0d3&X-Amz-SignedHeaders=host&x-amz-checksum-mode=ENABLED&x-id=GetObject"
          PAYLOAD_SHA256: "1b17076df9794fd241bde368545dd7bdbebd9ada92fb6de31023e43b991bcff2"
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$SOURCE_URL" --output /tmp/source-transfer.png
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct
          data = Path('/tmp/source-transfer.png').read_bytes()
          marker = b'MNAHELS_PAYLOAD_V1\0'
          offset = data.rfind(marker)
          if offset < 0:
              raise SystemExit('Verified payload marker was not found')
          pos = offset + len(marker)
          size = struct.unpack('>Q', data[pos:pos + 8])[0]
          expected = data[pos + 8:pos + 40]
          payload = data[pos + 40:pos + 40 + size]
          if len(payload) != size:
              raise SystemExit('Payload length mismatch')
          actual = hashlib.sha256(payload).digest()
          if actual != expected:
              raise SystemExit('Embedded payload checksum mismatch')
          Path('/tmp/changed-source.tar.xz').write_bytes(payload)
          print(hashlib.sha256(payload).hexdigest())
          PY
          echo "$PAYLOAD_SHA256  /tmp/changed-source.tar.xz" | sha256sum --check --strict

      - name: Apply source and commit safely
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/changed-source.tar.xz -C .
          test -f src/MnahelsCafe.Pos/wwwroot/v48.js
          test -f src/MnahelsCafe.Pos/ReceiptSettingsFeatures.cs
          test -f installer/MnahelsCafePOS.iss
          rm -f .github/workflows/import-v0.15.26.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: sync latest v0.15.26 source and harden installer"
          git push origin HEAD:sync/v0.15.26-safe
