name: Apply scroll hotfix v0.15.33

on:
  push:
    branches:
      - release/v0.15.32-final

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scroll-only hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.')
          js="""/* Mnahel's Cafe POS v0.15.33 · scroll lock hotfix */
          (()=>{'use strict';
          const BUILD='0.15.33',REV='20260902-scroll-hotfix-33';
          const q=(s,r=document)=>r.querySelector(s);
          let loginObserver=null;
          function resetViewport(){try{history.scrollRestoration='manual'}catch{}try{window.scrollTo({top:0,left:0,behavior:'instant'})}catch{window.scrollTo(0,0)}document.documentElement.scrollTop=0;document.body.scrollTop=0;q('.main')?.scrollTo?.(0,0)}
          function loginViewport(){const login=q('#login-screen'),visible=!!(login&&!login.classList.contains('hidden'));document.documentElement.classList.toggle('v54-login-visible',visible);if(visible)resetViewport()}
          function watchLogin(){const login=q('#login-screen');if(!login||login.dataset.v54ScrollWatch)return;login.dataset.v54ScrollWatch='1';loginObserver=new MutationObserver(loginViewport);loginObserver.observe(login,{attributes:true,attributeFilter:['class','hidden']})}
          document.addEventListener('click',event=>{if(event.target.closest?.('#logout')){try{sessionStorage.setItem('mnahels-reset-scroll','1')}catch{}resetViewport()}},true);
          window.addEventListener('pageshow',()=>{let reset=false;try{reset=sessionStorage.getItem('mnahels-reset-scroll')==='1';sessionStorage.removeItem('mnahels-reset-scroll')}catch{}if(reset||!q('#login-screen')?.classList.contains('hidden'))resetViewport();loginViewport()});
          function boot(){document.documentElement.dataset.uiRevision=REV;window.__MNAHELS_UI_REVISION__=REV;watchLogin();loginViewport();const service=q('#screen-service');if(service)service.classList.toggle('v54-readonly',state?.user?.role!=='Admin')}
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();setTimeout(boot,650);setTimeout(boot,1600);
          window.mnahelsV54={build:BUILD,uiRevision:REV,resetViewport,loginViewport};
          })();
          """
          (root/'src/MnahelsCafe.Pos/wwwroot/v54.js').write_text(js)
          p=root/'src/MnahelsCafe.Pos/wwwroot/v54.css'; s=p.read_text()
          s=s.replace("/* Mnahel's Cafe POS v0.15.32 · static order photography, compact cards, cashier Service Hub */","/* Mnahel's Cafe POS v0.15.33 · scroll lock hotfix */",1)
          old="html.v54-login-visible,html.v54-login-visible body{height:100%;overflow:hidden!important;scroll-behavior:auto!important}.login-screen:not(.hidden){position:fixed!important;inset:0!important;width:100%!important;height:100dvh!important;min-height:100dvh!important;z-index:9999!important;overflow:hidden!important}"
          new=old+"html:not(.v54-login-visible),html:not(.v54-login-visible) body{height:auto!important;min-height:100%!important;overflow-y:auto!important;overflow-x:hidden!important}.app-shell:not(.hidden){height:auto!important;min-height:100dvh!important;overflow:visible!important}.app-shell:not(.hidden)>.main{height:auto!important;min-height:100dvh!important;overflow-y:visible!important}#screen-pos.active,#screen-pos.active .pos-grid,#screen-pos.active .catalog-panel,#screen-pos.active .product-grid{height:auto!important;overflow-y:visible!important}#v38-order-setup[open]{height:min(780px,92dvh)!important;max-height:92dvh!important}#v38-order-setup .v38-setup-shell{height:100%!important;max-height:none!important;min-height:0!important}#v38-setup-body{min-height:0!important;overflow-y:auto!important;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}"
          if s.count(old)!=1: raise RuntimeError('scroll CSS marker mismatch')
          p.write_text(s.replace(old,new,1).replace('POS BUILD\\A 0.15.32','POS BUILD\\A 0.15.33',1))
          for name in ['src/MnahelsCafe.Pos/MnahelsCafe.Pos.csproj','src/MnahelsCafe.Desktop/MnahelsCafe.Desktop.csproj','src/MnahelsCafe.Desktop/Program.cs','installer/MnahelsCafePOS.iss','RUN-APP.ps1','START-MNAHELS-POS.cmd','START-HERE.txt']:
              p=root/name; text=p.read_text()
              if '0.15.32' not in text: raise RuntimeError(f'version marker missing: {name}')
              p.write_text(text.replace('0.15.32','0.15.33'))
          p=root/'src/MnahelsCafe.Pos/wwwroot/index.html'; text=p.read_text()
          text=text.replace('application-version\" content=\"0.15.32','application-version\" content=\"0.15.33',1)
          text=text.replace('/v54.css?v=20260901-performance-service-32','/v54.css?v=20260902-scroll-hotfix-33',1)
          text=text.replace('/v54.js?v=20260901-performance-service-32','/v54.js?v=20260902-scroll-hotfix-33',1)
          p.write_text(text)
          PY
          node --check src/MnahelsCafe.Pos/wwwroot/v54.js
          grep -q "attributeFilter:\['class','hidden'\]" src/MnahelsCafe.Pos/wwwroot/v54.js
          grep -q '#v38-setup-body{min-height:0!important;overflow-y:auto!important' src/MnahelsCafe.Pos/wwwroot/v54.css
          grep -q '0.15.33' installer/MnahelsCafePOS.iss
          rm .github/workflows/apply-scroll-hotfix.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix menu and setup scrolling in v0.15.33'
          git push origin HEAD
