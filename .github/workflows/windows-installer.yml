name: Build Windows installer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, sync/v0.15.26-safe]

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-server:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore server
        run: dotnet restore src/MnahelsCafe.Pos/MnahelsCafe.Pos.csproj --runtime win-x64 --nologo
      - name: Build server
        run: dotnet build src/MnahelsCafe.Pos/MnahelsCafe.Pos.csproj -c Release -r win-x64 --self-contained true --no-restore --nologo

  build-desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore desktop
        run: dotnet restore src/MnahelsCafe.Desktop/MnahelsCafe.Desktop.csproj --runtime win-x64 --nologo
      - name: Build desktop
        run: dotnet build src/MnahelsCafe.Desktop/MnahelsCafe.Desktop.csproj -c Release -r win-x64 --self-contained true --no-restore --nologo

  publish:
    needs: [build-server, build-desktop]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained Windows app
        shell: pwsh
        run: ./scripts/publish-windows.ps1
      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: published-win-x64-${{ github.run_id }}
          path: publish/win-x64
          if-no-files-found: error
          retention-days: 1

  compile-installer:
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download published app
        uses: actions/download-artifact@v4
        with:
          name: published-win-x64-${{ github.run_id }}
          path: publish/win-x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Compile installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler (ISCC.exe) was not found.' }
          & $iscc '/Qp' 'installer\MnahelsCafePOS.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }
      - name: Verify installer and write checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem 'installer\output\*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one installer, found $($installers.Count)." }
          $installer = $installers[0]
          if ($installer.Length -lt 1MB) { throw "Installer is unexpectedly small: $($installer.Length) bytes." }
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          '{0} *{1}' -f $hash.Hash, $installer.Name | Set-Content 'installer\output\SHA256SUMS.txt' -Encoding ascii
          Write-Host "Verified $($installer.Name) ($([math]::Round($installer.Length / 1MB, 2)) MB)"
          Write-Host "SHA256 $($hash.Hash)"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MnahelsCafePOS-Windows-Installer
          path: installer/output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
